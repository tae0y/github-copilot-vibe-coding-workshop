openapi: 3.0.1
info:
  title: Simple Social Media API
  version: 1.0.0
  description: |
    간단한 소셜 미디어 애플리케이션의 RESTful API입니다. 게시물, 댓글, 좋아요 기능을 제공합니다.
servers:
  - url: http://localhost:8080/api
paths:
  /posts:
    get:
      summary: 게시물 목록 조회
      tags: [Posts]
      responses:
        '200':
          description: 게시물 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    post:
      summary: 게시물 생성
      tags: [Posts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '201':
          description: 생성된 게시물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
  /posts/{postId}:
    get:
      summary: 단일 게시물 조회
      tags: [Posts]
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 게시물 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: 게시물 업데이트
      tags: [Posts]
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdateRequest'
      responses:
        '200':
          description: 업데이트된 게시물
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: 게시물 삭제
      tags: [Posts]
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: 삭제 성공
        '404':
          $ref: '#/components/responses/NotFound'
  /posts/{postId}/comments:
    get:
      summary: 게시물의 댓글 목록 조회
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 댓글 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: 댓글 생성
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: 생성된 댓글
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /posts/{postId}/comments/{commentId}:
    get:
      summary: 특정 댓글 조회
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/CommentId'
      responses:
        '200':
          description: 댓글 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: 댓글 업데이트
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdateRequest'
      responses:
        '200':
          description: 업데이트된 댓글
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: 댓글 삭제
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204':
          description: 삭제 성공
        '404':
          $ref: '#/components/responses/NotFound'
  /posts/{postId}/likes:
    post:
      summary: 게시물 좋아요
      tags: [Likes]
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LikeRequest'
      responses:
        '201':
          description: 좋아요 성공
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: 게시물 좋아요 취소
      tags: [Likes]
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LikeRequest'
      responses:
        '204':
          description: 좋아요 취소 성공
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
      description: 게시물 ID
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
      description: 댓글 ID
  schemas:
    Post:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        likesCount:
          type: integer
      required: [id, username, content, createdAt, updatedAt, likesCount]
    PostCreateRequest:
      type: object
      properties:
        username:
          type: string
        content:
          type: string
      required: [username, content]
    PostUpdateRequest:
      type: object
      properties:
        username:
          type: string
        content:
          type: string
      required: [username, content]
    Comment:
      type: object
      properties:
        id:
          type: string
        postId:
          type: string
        username:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, postId, username, content, createdAt, updatedAt]
    CommentCreateRequest:
      type: object
      properties:
        username:
          type: string
        content:
          type: string
      required: [username, content]
    CommentUpdateRequest:
      type: object
      properties:
        username:
          type: string
        content:
          type: string
      required: [username, content]
    LikeRequest:
      type: object
      properties:
        username:
          type: string
      required: [username]
    Error:
      type: object
      properties:
        message:
          type: string
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
